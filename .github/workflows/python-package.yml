# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  base:
    name: Base package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install base package and test tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install -e .
    - name: Verify optional dependencies are not installed
      run: |
        python -c "import importlib.util; assert importlib.util.find_spec('streamrip') is None"
        python -c "import importlib.util; assert importlib.util.find_spec('spotify_scraper') is None"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest

  deezer:
    name: Deezer extra (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package with Deezer support
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install -e ".[deezer]"
    - name: Verify Deezer driver import
      run: |
        python -c "from tunesynctool import DeezerDriver; print(DeezerDriver.__name__)"
    - name: Test optional dependency behavior
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest tests/test_optional_deezer.py

  spotify-public:
    name: Spotify public extra (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package with public Spotify playlist support
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install -e ".[spotify-public]"
    - name: Verify SpotifyScraper import
      run: |
        python -c "from spotify_scraper import SpotifyClient; print(SpotifyClient.__name__)"
    - name: Test optional dependency behavior and public Spotify driver
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest tests/spotify_public_driver tests/test_optional_spotify_public.py
